name: CI

# Pull requests and main only. Before, branches with an open PR ran CI twice,
# once for the push and once for the PR. Every change reaches main through a
# PR, so this still tests everything once. Use "Run workflow" for a branch
# without a PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which packages a push or PR touched, so an aicli-only change does
  # not pay for the TypeScript and llmforge matrices (and vice versa). Changes
  # to workflows, the Makefile or shared fixtures run everything. When the
  # base commit is unknown (a new branch, a force-push), everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.diff.outputs.python }}
      typescript: ${{ steps.diff.outputs.typescript }}
      aicli: ${{ steps.diff.outputs.aicli }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            files="ALL"
          fi
          hit() { [ "$files" = "ALL" ] || grep -qE "$1|^\.github/workflows/|^Makefile$" <<< "$files"; }
          for pkg in python typescript aicli; do
            case $pkg in
              python)     pattern='^packages/llmforge-python/|^fixtures/|^examples/' ;;
              typescript) pattern='^packages/llmforge-typescript/|^fixtures/' ;;
              aicli)      pattern='^packages/aicli/' ;;
            esac
            if hit "$pattern"; then echo "$pkg=true"; else echo "$pkg=false"; fi >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"

  # Seconds to run, so it always runs: the map in CLAUDE.md and the README
  # must match the tree.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_layout.py

  python:
    name: python ${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/llmforge-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/llmforge-python/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest tests -q
      - name: Doctests
        # The docstrings make claims; the doctests keep them true.
        run: pytest --doctest-modules src/llmforge -q

  aicli:
    name: aicli python ${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.aicli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: packages/aicli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/aicli/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        # No credentials: HTTP is stubbed and the echo provider stands in.
        run: pytest -q

  typescript:
    name: typescript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/llmforge-typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  examples:
    name: examples run offline
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No credentials are set. Everything here must run against FakeProvider,
      # which is the property that keeps the examples honest.
      - run: python examples/01_assured_change.py
      - run: python examples/02_gate_catches_a_drive_by.py

  assurance:
    name: assurance gates on this PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the gates we ship against our own diff
        # Advisory: request terms are not knowable from CI, so scope checks
        # would be noise. Reported, never blocking. `/assure` is the real gate,
        # run by a human who knows what was asked for.
        continue-on-error: true
        run: |
          cd packages/llmforge-python
          PYTHONPATH=src python3 - <<'PY'
          import subprocess
          from llmforge.assurance import Verdict, complexity_budget, diff_discipline

          # Paths whose entire purpose is to contain bad patterns. Scanning
          # them reports the fixtures as defects and buries anything real.
          EXEMPT = (
              "fixtures/",
              "examples/02_gate_catches_a_drive_by.py",
              "packages/llmforge-python/tests/test_assurance.py",
              "packages/llmforge-typescript/test/assurance.test.ts",
          )

          def git(*args: str) -> str:
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, cwd="../.."
              ).stdout

          base = git("merge-base", "HEAD", "origin/${{ github.base_ref }}").strip()
          diff = git("diff", base, "HEAD")
          verdict = diff_discipline(diff)

          # Per file, not one concatenated blob: a blob makes every line number
          # meaningless and mixes product code with test fixtures.
          for path in git("diff", "--name-only", base, "HEAD").split():
              if path.startswith(EXEMPT) or not path.endswith((".py", ".ts", ".js")):
                  continue
              added = "\n".join(
                  line[1:]
                  for line in git("diff", base, "HEAD", "--", path).splitlines()
                  if line.startswith("+") and not line.startswith("+++")
              )
              if added.strip():
                  file_verdict = complexity_budget(added)
                  for violation in file_verdict.violations:
                      violation.location = (
                          f"{path}:{violation.location}" if violation.location else path
                      )
                  verdict = verdict + file_verdict

          print(verdict.report())
          PY
